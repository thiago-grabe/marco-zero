services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marco_zero_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Porta fixa 5490 no host — evita conflito com qualquer outro Postgres local
      # ou de outros projetos (5432, 5433, etc.)
      - "5490:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
